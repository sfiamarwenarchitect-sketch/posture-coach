    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeIn 0.3s ease-out; }
    .skeleton { stroke: #10B981; stroke-width: 2; fill: none; }
    .skeleton-ref { stroke: #FFFFFF; stroke-width: 2; fill: none; }
    .score-ring { transition: all 0.3s ease; }
    .badge-anim { animation: pop 0.5s ease; }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>

    const VideoCaptureScreen = ({ view, exercise, onNavigate }) => {
      const [recording, setRecording] = useState(false);
      const [timer, setTimer] = useState(5);
      const [distanceOk, setDistanceOk] = useState(false);
      
      useEffect(() => {
        if (recording) {
          const interval = setInterval(() => {
            setTimer(t => {
              if (t <= 1) {
                clearInterval(interval);
                setRecording(false);
                return 0;
              }
              return t - 1;
            });
          }, 1000);
          return () => clearInterval(interval);
        }
      }, [recording]);
      
      return React.createElement("div", { className: "min-h-screen bg-gray-50 animate-fade" },
        React.createElement("div", { className: "bg-white shadow-md p-4" },

          React.createElement("div", { className: "text-gray-400 text-center" },
            React.createElement("svg", { className: "w-6 h-6 mx-auto mb-1", fill: "none", stroke: "currentColor", "stroke-width": "2", viewBox: "0 0 24 24" },
              React.createElement("path", { d: "M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" })
            ),
            React.createElement("span", { className: "text-xs" }, "Historique")
          ),
          React.createElement("div", { className: "text-gray-400 text-center" },
            React.createElement("svg", { className: "w-6 h-6 mx-auto mb-1", fill: "none", stroke: "currentColor", "stroke-width": "2", viewBox: "0 0 24 24" },
              React.createElement("path", { d: "M13 7h8m0 0v8m0-8l-8 8-4-4" })
            ),
            React.createElement("span", { className: "text-xs" }, "Progression")
          ),
          React.createElement("div", { className: "text-gray-400 text-center" },
            React.createElement("svg", { className: "w-6 h-6 mx-auto mb-1", fill: "none", stroke: "currentColor", "stroke-width": "2", viewBox: "0 0 24 24" },
              React.createElement("path", { d: "M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a6 6 0 00-6 6v2h12v-2a6 6 0 00-6-6z" })
            ),
            React.createElement("span", { className: "text-xs" }, "Profil")
          )
        )
      );
    };

    const ViewSelectionScreen = ({ exercise, onNavigate }) => {
      return React.createElement("div", { className: "min-h-screen bg-gray-50 animate-fade" },
        React.createElement("div", { className: "bg-white shadow-md p-4" },
          React.createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "Choix de la vue")
        ),
        React.createElement("div", { className: "p-4" },
          React.createElement("h2", { className: "text-lg font-bold text-gray-800 mb-4" }, "Quelle vue utiliser pour cette séance ?"),
          React.createElement("p", { className: "text-gray-600 mb-4" }, "Choisis l'angle qui correspond à ton installation actuelle."),
          React.createElement(Card, { className: "space-y-4" },
            React.createElement(Button, { 
              fullWidth: true, 
              onClick: () => onNavigate('calibration', exercise, 'front')
            }, "Vue de face"),
            React.createElement("p", { className: "text-center text-gray-500" }, "OU"),
            React.createElement(Button, { 
              fullWidth: true, 
              variant: "outline",
              onClick: () => onNavigate('calibration', exercise, 'side')
            }, "Vue de profil")
          ),
          React.createElement("div", { className: "bg-emerald-50 p-4 rounded-xl mt-4" },
            React.createElement("p", { className: "text-emerald-700 text-sm" }, "Conseil : Assure-toi d'avoir assez d'espace pour être entièrement visible.")
          )
        )
      );
    };

    const CalibrationScreen = ({ exercise, view, onNavigate }) => {
      const [distanceOk, setDistanceOk] = useState(false);
      const [calibrating, setCalibrating] = useState(true);
      
      useEffect(() => {
        if (calibrating) {
          const timer = setTimeout(() => {
            setDistanceOk(true);
            setCalibrating(false);
          }, 2000);
          return () => clearTimeout(timer);
        }
      }, [calibrating]);
      
      return React.createElement("div", { className: "min-h-screen bg-gray-50 animate-fade" },
        React.createElement("div", { className: "bg-white shadow-md p-4" },
          React.createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "Calibration")
        ),
        React.createElement("div", { className: "p-4" },
          React.createElement("div", { className: "flex justify-center space-x-2 mb-4" },
            React.createElement("div", { className: "w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center" }, "1"),
            React.createElement("div", { className: "w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center" }, "2")
          ),
          React.createElement(Card, { className: "text-center py-8" },
            React.createElement("p", { className: "text-gray-700 mb-2" }, "Veuillez vous placer face au téléphone, pieds visibles."),
            React.createElement("div", { className: "relative bg-gray-200 rounded-2xl h-64 flex items-center justify-center" },
              React.createElement("div", { className: "text-6xl" }, "🏃‍♀️"),
              calibrating && React.createElement("div", { className: "absolute bottom-4 left-4 right-4 bg-blue-50 p-3 rounded-xl" },
                React.createElement("p", { className: "text-blue-700 font-semibold" }, "Distance mesurée : 1,85 m"),
                React.createElement("p", { className: "text-blue-600 text-sm" }, "Veuillez reculer de 15 cm")
              ),
              !calibrating && React.createElement("div", { className: "absolute bottom-4 left-4 right-4 bg-emerald-50 p-3 rounded-xl" },
                React.createElement("p", { className: "text-emerald-700 font-semibold" }, "Distance idéale : 2,00 m"),
                React.createElement("p", { className: "text-emerald-600 text-sm" }, "OK ✓")
              )
            )
          ),
          !calibrating && React.createElement("div", { className:mt-4" },
            React.createElement("p", { className: "text-gray-700 mb-2" }, "Votre taille enregistrée :"),
            React.createElement("div", { className: "text-2xl font-bold text-emerald-500 mb-4" }, "1,68 m"),
            React.createElement("p", { className: "text-gray-600 mb-4" }, "Est-ce correct ?"),
            React.createElement("div", { className: "flex space-x-3" },
              React.createElement(Button, { className: "flex-1", variant: "secondary" }, "Modifier"),
              React.createElement(Button, { className: "flex-1", onClick: () => onNavigate('exercise', exercise) }, "Confirmer")
            )
          )
        )
      );
    };

    const ExerciseScreen = ({ exercise, onNavigate }) => {
      const [score, setScore] = useState(85);
      const [reps, setReps] = useState(3);
      const [time, setTime] = useState(28);
      const [error, setError] = useState(null);
      
      return React.createElement("div", { className: "min-h-screen bg-gray-50 animate-fade" },
        React.createElement("div", { className: "bg-white shadow-md p-4" },
          React.createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "Entraînement")
        ),
        React.createElement("div", { className: "p-4" },
          React.createElement("div", { className: "relative bg-gray-800 rounded-2xl h-96 flex items-center justify-center" },
            React.createElement("div", { className: "text-white text-center" },
              React.createElement("div", { className: "text-6xl mb-4" }, exercise.icon),
              React.createElement("p", { className: "text-gray-300" }, "Squelette en temps réel")
            ),
            React.createElement("div", { className: "absolute top-4 right-4" },
              React.createElement("div", { className: `w-16 h-16 rounded-full flex items-center justify-center ${score >= 70 ? 'bg-emerald-500' : score >= 50 ? 'bg-yellow-500' : 'bg-red-500'}` },
                React.createElement("span", { className: "text-white font-bold" }, score + "%")
              ),
              error && React.createElement("div", { className: "bg-red-100 p-2 rounded-lg mt-2 text-sm" }, error)
            )
          ),
          React.createElement("div", { className: "mt-4" },
            React.createElement("p", { className: "text-center text-gray-500" }, exercise.name + " | Série 1/3 | " + reps + " répétitions"),
            React.createElement("p", { className: "text-center text-gray-500" }, "Temps: 00:" + String(time).padStart(2, '0'))
          ),
          React.createElement("div", { className: "flex space-x-3 mt-4" },
            React.createElement(Button, { className: "flex-1", variant: "secondary" }, "Terminer"),
            React.createElement(Button, { className: "flex-1" }, "Rejouer")
          )
        )
      );
    };

    // Application principale
    const App = () => {
      const [currentScreen, setCurrentScreen] = useState('coach-login');
      const [selectedExercise, setSelectedExercise] = useState(null);
      const [clientData, setClientData] = useState(null);
      const [viewType, setViewType] = useState(null);
      
      const handleNavigate = (screen, data = null, view = null) => {
        setCurrentScreen(screen);
        if (data) {
          if (screen === 'config') {
            setSelectedExercise(data);
          } else if (screen === 'calibration') {
            setSelectedExercise(data);
            setViewType(view);
          } else if (screen === 'exercise') {
            setSelectedExercise(data);
          }
        }
      };
      
      const renderScreen = () => {
        switch (currentScreen) {
          case 'coach-login':
            return CoachLoginScreen({ onNavigate: (s) => setCurrentScreen(s) });
          case 'dashboard':
            return CoachDashboardScreen({ onNavigate: (s, d) => {
              if (d) {
                setClientData(d);
                setCurrentScreen('client');
              } else {
                setCurrentScreen(s);
              }
            }});
          case 'client':
            return ClientProfileScreen({ client: clientData, onNavigate: (s) => setCurrentScreen(s) });
          case 'library':
            return ExerciseLibraryScreen({ onNavigate: (s, d) => {
              if (d) {
                setSelectedExercise(d);
                setCurrentScreen('config');
              } else {
                setCurrentScreen(s);
              }
            }});
          case 'config':
            return KeyPointsConfigScreen({ exercise: selectedExercise, onNavigate: (s) => setCurrentScreen(s) });
          case 'capture1':
            return VideoCaptureScreen({ view: 1, exercise: selectedExercise, onNavigate: (s, v) => {
              if (v) {
                setCurrentScreen('verify' + v);
              } else {
                setCurrentScreen(s);
              }
            }});
          case 'capture2':
            return VideoCaptureScreen({ view: 2, exercise: selectedExercise, onNavigate: (s, v) => {
              if (v) {
                setCurrentScreen('verify' + v);
              } else {
                setCurrentScreen(s);
              }
            }});
          case 'verify1':
          case 'verify2':
            return VerificationScreen({ view: currentScreen === 'verify1' ? 1 : 2, exercise: selectedExercise, onNavigate: (s, v) => {
              if (v) {
                setCurrentScreen('capture' + v);
              } else {
                setCurrentScreen(s);
              }
            }});
          case 'summary':
            return SummaryScreen({ exercise: selectedExercise, onNavigate: (s) => setCurrentScreen(s) });
          case 'success':
            return React.createElement("div", { className: "min-h-screen bg-gray-50 animate-fade flex items-center justify-center" },
              React.createElement("div", { className: "text-center p-8" },
                React.createElement("div", { className: "bg-emerald-500 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6" },
                  React.createElement("svg", { className: "w-12 h-12 text-white", fill: "none", stroke: "currentColor", "stroke-width": "3", viewBox: "0 0 24 24" },
                    React.createElement("path", { d: "M5 13l4 4L19 7", "stroke-linecap": "round", "stroke-linejoin": "round" })
                  )
                ),
                React.createElement("h1", { className: "text-2xl font-bold text-emerald-700 mb-4" }, "Enregistré avec succès !"),
                React.createElement("p", { className: "text-gray-600 mb-8" }, "L'exercice a été ajouté à la fiche du client"),
                Button({ fullWidth: true, onClick: () => setCurrentScreen('dashboard') }, "Retour au tableau de bord")
              )
            );
          case 'user-home':
            return UserHomeScreen({ onNavigate: (s, d, v) => {
              if (d) {
                setSelectedExercise(d);
                setCurrentScreen(s);
              } else {
                setCurrentScreen(s);
              }
            }});
          case 'view-select':
            return ViewSelectionScreen({ exercise: selectedExercise, onNavigate: (s, d, v) => {
              if (d) {
                setSelectedExercise(d);
                setViewType(v);
                setCurrentScreen('calibration');
              } else {
                setCurrentScreen(s);
              }
            }});
          case 'calibration':
            return CalibrationScreen({ exercise: selectedExercise, view: viewType, onNavigate: (s, d) => {
              if (d) {
                setSelectedExercise(d);
                setCurrentScreen('exercise');
              } else {
                setCurrentScreen(s);
              }
            }});
          case 'exercise':
            return ExerciseScreen({ exercise: selectedExercise, onNavigate: (s, d) => {
              if (d) {
                setSelectedExercise(d);
              }
              setCurrentScreen(s);
            }});
          default:
            return CoachLoginScreen({ onNavigate: (s) => setCurrentScreen(s) });
        }
      };
      
      return React.createElement("div", null,
        React.createElement("div", { className: "fixed top-4 left-4 bg-white p-2 rounded-lg shadow-md z-50" },
          React.createElement("button", { className: "px-3 py-1 bg-emerald-500 text-white rounded-lg mr-2", onClick: () => setCurrentScreen('coach-login') }, "Coach"),
          React.createElement("button", { className: "px-3 py-1 bg-gray-200 text-gray-700 rounded-lg", onClick: () => setCurrentScreen('user-home') }, "Utilisateur")
        ),
        renderScreen()
      );
    };

    // Rendu de l'application
    ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
