<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posture Coach - Entraînement Intelligent</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"><%/script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><%/script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"><%/script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .anim { animation: fadeIn 0.3s ease-out; }
    body { background: #f0fdf4; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, createElement } = React;

    function Btn(props) {
      const v = props.variant || 'primary';
      const cls = "font-semibold rounded-xl py-3 px-6 transition-all duration-200 " + (props.fullWidth ? "w-full " : "") +
        (v === 'primary' ? "bg-emerald-500 text-white hover:bg-emerald-600 shadow-lg" :
         v === 'secondary' ? "bg-gray-200 text-gray-700 hover:bg-gray-300" :
         v === 'outline' ? "border-2 border-emerald-500 text-emerald-500 hover:bg-emerald-50" :
         "bg-red-500 text-white hover:bg-red-600");
      return createElement("button", { className: cls, onClick: props.onClick }, props.children);
    }

    function Inp(props) {
      return createElement("div", { className: "mb-4" },
        createElement("label", { className: "block text-sm font-medium text-gray-700 mb-1" }, props.label),
        createElement("input", { type: props.type || "text", placeholder: props.placeholder, value: props.value, onChange: props.onChange, className: "w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500" })
      );
    }

    function C(props) {
      return createElement("div", { className: "bg-white rounded-2xl shadow-md p-4 " + (props.className || "") }, props.children);
    }

    function CoachLogin() {
      const [email, setEmail] = useState('coach.marc@email.com');
      const [pass, setPass] = useState('');
      return createElement("div", { className: "min-h-screen bg-gradient-to-br from-emerald-50 to-emerald-100 p-6 anim" },
        createElement("div", { className: "max-w-md mx-auto" },
          createElement("div", { className: "text-center mb-8" },
            createElement("div", { className: "bg-emerald-500 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4" },
              createElement("span", { className: "text-white text-3xl" }, "\u2713")
            ),
            createElement("h1", { className: "text-2xl font-bold text-emerald-700" }, "POSTURE COACH"),
            createElement("p", { className: "text-gray-600 mt-2" }, "Acc\u00e8s r\u00e9serv\u00e9 aux coachs agr\u00e9\u00e9s")
          ),
          createElement(C, { className: "space-y-4" },
            createElement("h2", { className: "text-xl font-bold text-gray-800 mb-4" }, "Connexion coach"),
            Inp({ label: "Email", type: "email", value: email, onChange: e => setEmail(e.target.value), placeholder: "coach@email.com" }),
            Inp({ label: "Mot de passe", type: "password", value: pass, onChange: e => setPass(e.target.value) }),
            createElement("div", { className: "flex items-center justify-between text-sm" },
              createElement("label", { className: "flex items-center" },
                createElement("input", { type: "checkbox", className: "mr-2" }), "Se souvenir de moi"),
              createElement("a", { href: "#", className: "text-emerald-500 hover:underline" }, "Mot de passe oubli\u00e9 ?")
            ),
            Btn({ fullWidth: true, onClick: window.goDashboard }, "Se connecter"),
            createElement("div", { className: "text-center text-gray-500 my-4" }, "OU"),
            Btn({ variant: "outline", fullWidth: true }, "Se connecter avec Face ID")
          )
        )
      );
    }

    function CoachDashboard() {
      const clients = [
        { name: "Sarah Martin", email: "sarah@email.com", purchased: "12/05/2026", exercises: "1/10", avatar: "SM" },
        { name: "Thomas Bernard", email: "thomas@email.com", purchased: "15/05/2026", exercises: "3/10", avatar: "TB" },
        { name: "Laura Petit", email: "laura@email.com", purchased: "20/05/2026", exercises: "2/10", avatar: "LP" }
      ];
      return createElement("div", { className: "min-h-screen bg-gray-50 anim" },
        createElement("div", { className: "bg-white shadow-md p-4" },
          createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "Tableau de bord"),
          createElement("p", { className: "text-gray-600" }, "Clients avec pack standard actif")
        ),
        createElement("div", { className: "p-4" },
          Inp({ placeholder: "Rechercher un client..." }),
          createElement("div", { className: "space-y-3" },
            clients.map(client => {
              return createElement(C, { className: "flex items-center space-x-4 cursor-pointer hover:bg-emerald-50" },
                createElement("div", { className: "w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 font-bold" }, client.avatar),
                createElement("div", { className: "flex-1" },
                  createElement("h3", { className: "font-semibold text-gray-800" }, client.name),
                  createElement("p", { className: "text-sm text-gray-500" }, client.email),
                  createElement("p", { className: "text-sm text-emerald-600" }, client.exercises + " exercices")
                )
              );
            })
          )
        ),
        createElement("div", { className: "fixed bottom-0 left-0 right-0 bg-white shadow-inner py-3 px-4 flex justify-around" },
          createElement("div", { className: "text-emerald-600 text-center" }, createElement("span", { className: "text-xs" }, "Clients")),
          createElement("div", { className: "text-gray-400 text-center" }, createElement("span", { className: "text-xs" }, "S\u00e9ances")),
          createElement("div", { className: "text-gray-400 text-center" }, createElement("span", { className: "text-xs" }, "Profil"))
        )
      );
    }

    function ExerciseLibrary() {
      const exercises = [
        { name: "Squat", type: "Dynamique", icon: "\ud83d\udcaa" },
        { name: "Pompe", type: "Dynamique", icon: "\ud83d\udcaa" },
        { name: "Fente", type: "Dynamique", icon: "\ud83e\udeb2" },
        { name: "Gainage", type: "Statique", icon: "\ud83e\uddd8" },
        { name: "Soulev\u00e9 de terre", type: "Dynamique", icon: "\ud83c\udfcb" },
        { name: "Tractions", type: "Dynamique", icon: "\ud83d\udcaa" }
      ];
      return createElement("div", { className: "min-h-screen bg-gray-50 anim" },
        createElement("div", { className: "bg-white shadow-md p-4" },
          createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "Biblioth\u00e8que d'exercices")
        ),
        createElement("div", { className: "p-4 grid grid-cols-2 gap-4" },
          exercises.map(ex => {
            return createElement(C, { className: "text-center cursor-pointer hover:bg-emerald-50" },
              createElement("div", { className: "text-4xl mb-2" }, ex.icon),
              createElement("h3", { className: "font-semibold text-gray-800" }, ex.name),
              createElement("span", { className: "text-xs text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full mt-2 inline-block" }, ex.type)
            );
          })
        )
      );
    }

    function KeyPointsConfig() {
      const points = ['Genoux', 'Hanches', 'Bas du dos', 'Chevilles', "\u00c9paules", 'Nuque'];
      const [selected, setSelected] = useState(['Genoux', 'Hanches', 'Bas du dos', 'Chevilles']);
      const toggle = (p) => { setSelected(prev => prev.includes(p) ? prev.filter(x => x !== p) : [...prev, p]); };
      return createElement("div", { className: "min-h-screen bg-gray-50 anim" },
        createElement("div", { className: "bg-white shadow-md p-4" },
          createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "Configuration")
        ),
        createElement("div", { className: "p-4" },
          createElement("h2", { className: "text-gray-700 font-semibold mb-4" }, "S\u00e9lectionnez les points cl\u00e9s \u00e0 surveiller"),
          createElement(C, { className: "space-y-3" },
            points.map(p => {
              const sel = selected.includes(p);
              return createElement("div", { className: "flex items-center justify-between p-3 rounded-xl cursor-pointer " + (sel ? "bg-emerald-50 border-2 border-emerald-500" : "bg-gray-50"), onClick: () => toggle(p)},
                createElement("span", { className: "text-gray-700" }, p),
                createElement("span", { className: "text-xl " + (sel ? "text-emerald-500" : "text-gray-400") }, sel ? "\u2713" : "\u25cb")
              );
            })
          ),
          Btn({ fullWidth: true, onClick: window.goCapture }, "Valider et continuer")
        )
      );
    }

    function VideoCapture() {
      const [rec, setRec] = useState(false);
      return createElement("div", { className: "min-h-screen bg-gray-50 anim" },
        createElement("div", { className: "bg-white shadow-md p-4" },
          createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "Capture vid\u00e9o")
        ),
        createElement("div", { className: "p-4" },
          createElement(C, { className: "text-center py-4" },
            createElement("p", { className: "text-gray-700 mb-2" }, "Placez le client face \u00e0 la cam\u00e9ra, \u00e0 environ 2 m\u00e8tres")
          ),
          createElement("div", { className: "relative bg-gray-800 rounded-2xl overflow-hidden h-96 flex items-center justify-center my-4" },
            createElement("div", { className: "text-white text-center" },
              createElement("div", { className: "text-6xl mb-4" }, "\ud83d\udcaa"),
              createElement("p", { className: "text-gray-300" }, "Pr\u00eat pour la capture"),
              rec && createElement("div", { className: "mt-4 bg-red-500 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto animate-pulse" },
                createElement("span", { className: "text-2xl font-bold" }, "5")
              )
            )
          ),
          createElement("div", { className: "flex justify-center space-x-4 mt-4" },
            createElement("button", { className: "bg-gray-200 p-3 rounded-xl" }, "\u26a1"),
            createElement("button", { className: "bg-gray-200 p-3 rounded-xl" }, "\ud83d\udcf7"),
            createElement("button", { className: "p-4 rounded-full " + (rec ? "bg-red-500" : "bg-emerald-500"), onClick: () => setRec(!rec)}, rec ? "\u25a0" : "\u25cf")
          ),
          createElement("p", { className: "text-center text-gray-500 mt-2" }, "Appuyez pour d\u00e9marrer (5 secondes)"),
          Btn({ fullWidth: true, className: "mt-4", onClick: window.goVerify }, "V\u00e9rifier la capture")
        )
      );
    }

    function Verification() {
      return createElement("div", { className: "min-h-screen bg-gray-50 anim" },
        createElement("div", { className: "bg-white shadow-md p-4" },
          createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "V\u00e9rification")
        ),
        createElement("div", { className: "p-4" },
          createElement("div", { className: "relative bg-gray-800 rounded-2xl overflow-hidden h-96 flex items-center justify-center" },
            createElement("div", { className: "text-white text-center" },
              createElement("div", { className: "text-6xl mb-4" }, "\ud83d\udcaa"),
              createElement("p", { className: "text-gray-300" }, "Squelette d\u00e9tect\u00e9")
            )
          ),
          createElement("div", { className: "mt-4" },
            createElement("div", { className: "h-2 bg-gray-200 rounded-full overflow-hidden" },
              createElement("div", { className: "h-full bg-emerald-500 w-3/4" })
            ),
            createElement("p", { className: "text-center text-gray-500 mt-1" }, "0:02 / 0:05")
          ),
          createElement("div", { className: "bg-emerald-50 p-4 rounded-xl mt-4" },
            createElement("div", { className: "flex items-center space-x-2" },
              createElement("span", { className: "text-emerald-500 text-xl" }, "\u2713"),
              createElement("span", { className: "text-emerald-700 font-semibold" }, "Tous les points cl\u00e9s sont bien d\u00e9tect\u00e9s")
            )
          ),
          createElement("div", { className: "flex space-x-3 mt-4" },
            Btn({ className: "flex-1", variant: "secondary" }, "Refaire"),
            Btn({ className: "flex-1", variant: "outline" }, "Supprimer"),
            Btn({ className: "flex-1", onClick: window.goSummary }, "Valider")
          )
        )
      );
    }

    function SummaryScreen() {
      return createElement("div", { className: "min-h-screen bg-gray-50 anim" },
        createElement("div", { className: "bg-white shadow-md p-4" },
          createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "\u00c9cran bloqu\u00e9 - En attente")
        ),
        createElement("div", { className: "p-4" },
          createElement(C, { className: "text-center py-8" },
            createElement("h2", { className: "text-xl font-bold text-gray-800 mb-4" }, "Posture Coach"),
            createElement("p", { className: "text-gray-600 mb-4" }, "Application d'entra\u00eenement intelligent"),
            createElement("p", { className: "text-gray-500" }, "Interface d\u00e9monstration")
          )
        )
      );
    }

    function UserHome() {
      const exercises = [
        { name: "Squat", level: "Interm\u00e9diaire", icon: "\ud83d\udcaa" },
        { name: "Fentes", level: "Interm\u00e9diaire", icon: "\ud83e\udeb2" },
        { name: "Gainage", level: "Interm\u00e9diaire", icon: "\ud83e\uddd8" },
        { name: "Soulev\u00e9 de terre", level: "Avanc\u00e9", icon: "\ud83c\udfcb" }
      ];
      return createElement("div", { className: "min-h-screen bg-gray-50 anim" },
        createElement("div", { className: "bg-white shadow-md p-4" },
          createElement("h1", { className: "text-xl font-bold text-emerald-700" }, "Bonjour Sarah \ud83d\udc4b"),
          createElement("p", { className: "text-gray-600" }, "Pr\u00eate pour ta s\u00e9ance ?")
        ),
        createElement("div", { className: "p-4" },
          createElement("h2", { className: "text-lg font-bold text-gray-800 mb-4" }, "MES EXERCICES"),
          createElement("div", { className: "space-y-3" },
            exercises.map((ex, i) => {
              return createElement(C, { className: "flex items-center space-x-4 cursor-pointer hover:bg-emerald-50" },
                createElement("div", { className: "text-4xl" }, ex.icon),
                createElement("div", { className: "flex-1" },
                  createElement("h3", { className: "font-semibold text-gray-800" }, ex.name),
                  createElement("p", { className: "text-sm text-gray-500" }, ex.level)
                )
              );
            })
          )
        ),
        createElement("div", { className: "fixed bottom-0 left-0 right-0 bg-white shadow-inner py-3 px-4 flex justify-around" },
          createElement("div", { className: "text-emerald-600 text-center" }, createElement("span", { className: "text-xs" }, "Accueil")),
          createElement("div", { className: "text-gray-400 text-center" }, createElement("span", { className: "text-xs" }, "Historique")),
          createElement("div", { className: "text-gray-400 text-center" }, createElement("span", { className: "text-xs" }, "Progression")),
          createElement("div", { className: "text-gray-400 text-center" }, createElement("span", { className: "text-xs" }, "Profil"))
        )
      );
    }

    function App() {
      const [screen, setScreen] = useState('mode');

      // Fonctions de navigation
      const goTo = {
        mode: () => setScreen('mode'),
        coachLogin: () => setScreen('coachLogin'),
        dashboard: () => setScreen('dashboard'),
        library: () => setScreen('library'),
        config: () => setScreen('config'),
        capture: () => setScreen('capture'),
        verify: () => setScreen('verify'),
        summary: () => setScreen('summary'),
        userHome: () => setScreen('userHome')
      };

      // Exposer les fonctions globales
      window.goDashboard = goTo.dashboard;
      window.goLibrary = goTo.library;
      window.goConfig = goTo.config;
      window.goCapture = goTo.capture;
      window.goVerify = goTo.verify;
      window.goSummary = goTo.summary;

      // Rendu selon l'\u00e9cran
      if (screen === 'mode') {
        return createElement("div", { className: "min-h-screen bg-gradient-to-br from-emerald-50 to-emerald-100 flex items-center justify-center p-6 anim" },
          createElement("div", { className: "max-w-md text-center" },
            createElement("div", { className: "bg-emerald-500 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4" },
              createElement("span", { className: "text-white text-3xl" }, "\u2713")
            ),
            createElement("h1", { className: "text-2xl font-bold text-emerald-700 mb-2" }, "POSTURE COACH"),
            createElement("p", { className: "text-gray-600 mb-8" }, "Application d'entra\u00eenement intelligent"),
            Btn({ fullWidth: true, onClick: goTo.coachLogin }, "Mode Coach"),
            createElement("p", { className: "text-gray-500 my-4" }, "OU"),
            Btn({ fullWidth: true, variant: "outline", onClick: goTo.userHome }, "Mode Utilisateur")
          )
        );
      }
      if (screen === 'coachLogin') return CoachLogin();
      if (screen === 'dashboard') return CoachDashboard();
      if (screen === 'library') return ExerciseLibrary();
      if (screen === 'config') return KeyPointsConfig();
      if (screen === 'capture') return VideoCapture();
      if (screen === 'verify') return Verification();
      if (screen === 'summary') return SummaryScreen();
      if (screen === 'userHome') return UserHome();
      return null;
    }

    ReactDOM.render(createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
